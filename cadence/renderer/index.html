<!doctype html>
<html lang="en" data-dark="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: cadence:; media-src 'self' blob: data: cadence:; connect-src 'self' cadence: https://lrclib.net; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Cadence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="app" data-panel="on">
    <aside id="sidebar" class="panel-card" aria-label="Navigation">
      <div class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">Cadence</span></div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-head"><span>Playlists</span><button id="newPlaylist" class="icon-btn" title="New playlist" aria-label="New playlist"></button></div>
      <div id="sidePlaylists" class="side-list"></div>
    </aside>

    <main id="main" class="panel-card">
      <header id="topbar">
        <div class="nav-btns">
          <button id="backBtn" class="icon-btn" title="Back (Alt+←)" aria-label="Back"></button>
          <button id="fwdBtn" class="icon-btn" title="Forward (Alt+→)" aria-label="Forward"></button>
        </div>
        <label class="search" for="searchInput">
          <span id="searchIcon"></span>
          <input id="searchInput" type="search" placeholder="Search your library" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>
        <div class="top-right">
          <span id="scanStatus" class="scan-status" hidden></span>
          <button id="addBtn" class="btn small" title="Add music"></button>
        </div>
      </header>
      <div id="view" tabindex="-1"></div>
    </main>

    <aside id="nowPanel" class="panel-card" aria-label="Now playing"></aside>
    <footer id="playbar" aria-label="Player controls"></footer>
  </div>

  <section id="nowView" class="fullview" hidden aria-label="Full-screen player"></section>
  <div id="dropHint" class="drop-hint" hidden>Drop music, folders or playlist files to import</div>
  <div id="menuRoot"></div>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
